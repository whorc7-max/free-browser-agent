name: Run Browser Agent

"on":
  workflow_dispatch:
    inputs:
      task:
        description: "Browser task to execute"
        required: false
        type: string
        default: "Open https://example.com and report the page title and heading."
  repository_dispatch:
    types: [run-browser-agent]

permissions:
  contents: read

jobs:
  run-agent:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_MODEL: gemini-2.5-flash
      BROWSER_USE_HEADLESS: "true"
      ANONYMIZED_TELEMETRY: "false"
      RUN_PLAYWRIGHT_SMOKE_TEST: "true"
      AGENT_MAX_STEPS: "25"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Install Chromium for Playwright
        run: python -m playwright install --with-deps chromium

      - name: Run browser-use agent
        env:
          AGENT_TASK: ${{ github.event_name == 'repository_dispatch' && github.event.client_payload.task || inputs.task }}
        run: python agent.py

      - name: Upload agent result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-agent-result-${{ github.run_id }}
          path: agent_result.json
          if-no-files-found: warn
          retention-days: 7

